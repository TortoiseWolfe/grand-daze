# Data retention (#585).
#
# `cleanup_old_audit_logs()` has existed in the monolithic migration since the
# initial commit and was NEVER CALLED. Meanwhile the table COMMENT, two security
# audits and one E2E-teardown design decision all cited its 90-day window as
# though it were in force. Ten months on, the oldest row was four months old and
# auth_audit_logs was the largest table in the database. This workflow is the
# missing caller.
#
# WHY ITS OWN FILE, not a step in auth-config-drift.yml (which already holds the
# same two secrets, and which #585 suggested as the home): that workflow's check
# is named "Auth Config Drift". A red X there has to mean the live auth config
# diverged from the repo. If an audit-log DELETE timed out and reddened it, the
# check would be lying about what it verified — the same class of defect this
# ticket is fixing. Secrets are repo-scoped, so a separate file costs nothing.
#
# No service-role key. This uses the Management API pair (SUPABASE_ACCESS_TOKEN +
# SUPABASE_PROJECT_REF), which is deliberate: #574 is about getting the
# service-role credential OUT of CI, not about giving it another home.

name: Data Retention

on:
  # Deliberately NOT on push or pull_request. This workflow MUTATES production
  # data; it should run on a schedule a human chose, not incidentally on every
  # merge. Use the dispatch button for an out-of-band run.
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

concurrency:
  group: data-retention
  cancel-in-progress: false

jobs:
  audit-logs:
    name: auth_audit_logs past the 90-day window are deleted
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # IS THERE A PROJECT TO CLEAN? (#985)
      #
      # This repository has no Supabase project yet, so the script had nothing to delete
      # from and exited 1 on a missing token every night. Same preflight as the drift
      # workflows, for the same reasons: a step rather than a job-level `if:` because the
      # `secrets` context is not available there, and HALF-CONFIGURED STILL FAILS because
      # deleting the token must not silently retire a retention job that mutates
      # production data. Every later step is gated on it, so an unconfigured repository
      # does not even install dependencies.
      - name: Is a Supabase project configured?
        id: configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "  Supabase project configured — the retention job will run"
            exit 0
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] && [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Supabase project configured, so there are no audit logs to prune. Set the SUPABASE_PROJECT_REF repository VARIABLE and the SUPABASE_ACCESS_TOKEN repository SECRET to enable this job."
            exit 0
          fi
          echo "::error::Supabase is half-configured, which is not the same as unconfigured."
          [ -n "$SUPABASE_PROJECT_REF" ] || echo "::error::  missing repository VARIABLE  SUPABASE_PROJECT_REF"
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || echo "::error::  missing repository SECRET    SUPABASE_ACCESS_TOKEN"
          exit 1

      - name: Checkout code
        if: steps.configured.outputs.configured == 'true'
        uses: actions/checkout@v5

      - name: Install pnpm
        if: steps.configured.outputs.configured == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1

      - name: Setup Node.js
        if: steps.configured.outputs.configured == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.configured.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      # The script deletes, then RE-COUNTS and fails if rows past the window
      # survived a run that deleted nothing. Without that second query this job
      # would report success on any HTTP 200 — a retention job that cannot
      # detect its own failure, which is what #585 is about.
      #
      # It also cross-checks its RETENTION_DAYS constant against the INTERVAL in
      # the migration, so the number cannot drift between the enforcer and the
      # documents that quote it.
      #
      # A restricted project (#567, HTTP 402) exits 0 with a ::warning:: — that
      # is a quota incident, not a retention defect, and a job that goes red for
      # the duration of one trains people to ignore it.
      - name: Enforce auth_audit_logs retention
        if: steps.configured.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: pnpm supabase:retention
